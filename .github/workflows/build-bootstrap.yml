name: Build Minimal Bootstrap ZIP

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture (default: aarch64)"
        required: false
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - arm
          - x86_64
  push:
    tags:
      - 'v*'

jobs:
  build-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell

      - name: Build Minimal Bootstrap ZIP (~25MB)
        run: |
          python3 scripts/build_bootstrap_zip.py

      - name: Upload Bootstrap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uncode-bootstrap-${{ inputs.arch || 'aarch64' }}
          path: dist/*.zip
          retention-days: 90
